{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password · Orbit CRM</title><link rel="stylesheet" href="{% static 'crm/app.css' %}"></head><body class="auth-body"><main class="reset-card"><a class="brand" href="{% url 'login' %}"><span class="brand-mark">O</span><span>Orbit CRM</span></a><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset your password</h1><p>Enter your work email. If it belongs to an active account, we’ll send a reset link.</p><form method="post">{% csrf_token %}<label for="id_email">Work email</label><input class="form-control" type="email" name="email" id="id_email" autocomplete="email" required><button class="button primary auth-submit" type="submit">Send reset link</button></form><a class="forgot-link" href="{% url 'login' %}">← Back to sign in</a></main></body></html>
